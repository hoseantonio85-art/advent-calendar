    .entry-fir::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#09291d15 0%,transparent 50%,#09291d0d 100%);}
    .texture{pointer-events:none;position:absolute;inset:0;z-index:0;opacity:.24;background-image:radial-gradient(#eef5e07a .7px,transparent .95px);background-size:20px 21px;mask-image:linear-gradient(136deg,transparent 14%,#000 85%)}
    .glow{position:absolute;width:180px;height:120px;right:-25px;top:-8px;background:#e9efe11c;filter:blur(28px);border-radius:50%;pointer-events:none}
    .glass-star{position:absolute;right:34px;top:19px;color:#fff6d752;filter:drop-shadow(0 0 6px #ffe7a760);font-size:14px;animation:glint 4.5s ease-in-out infinite;pointer-events:none}
    .flake{position:absolute;pointer-events:none;border-radius:50%;background:#faf9e8b3;opacity:0;animation:snowfall 9s linear infinite;z-index:1;filter:drop-shadow(0 0 2px #fff8d966)}
    .f1{width:2px;height:2px;right:14%;top:-8px;animation-delay:-1s}.f2{width:1.5px;height:1.5px;right:29%;top:-9px;animation-delay:-4s}.f3{width:2px;height:2px;right:46%;top:-12px;animation-delay:-6s}
     .f4{width:2px;height:2px;right:6%;top:-9px;animation-delay:-7.2s;animation-duration:11s}
     .f5{width:1.5px;height:1.5px;right:21%;top:-11px;animation-delay:-2.8s;animation-duration:12s}
     .f6{width:2.5px;height:2.5px;right:37%;top:-8px;animation-delay:-8.3s;animation-duration:10s}
     .f7{width:1px;height:1px;right:54%;top:-8px;animation-delay:-3.6s;animation-duration:13s}
     .f8{width:2px;height:2px;right:69%;top:-8px;animation-delay:-5.5s;animation-duration:10.5s}
    @keyframes snowfall{0%{transform:translate(-5px,-5px);opacity:0}25%{opacity:.42}85%{opacity:.28}100%{transform:translate(12px,150px);opacity:0}}
    @keyframes glint{50%{opacity:.28;transform:scale(.82) rotate(25deg)}}
    .entry-layout{position:relative;z-index:3;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 88px;column-gap:10px;align-items:center}
    .copy{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
    /* No kicker, icon or ornament over the main headline: this is one typographic CTA. */
    .card-title{font-family:'Yeseva One',Georgia,serif;display:block;margin:0;font-weight:400;
      font-size:26px;line-height:1.13;letter-spacing:-.042em;white-space:nowrap;max-width:100%;text-shadow:0 2px 12px #01150f63}
    /* The countdown itself is the little calendar: translucent, short, without a stroke. */
    .time-pill{height:88px;width:88px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
      border-radius:16px;background:linear-gradient(155deg,#ffffff17,#e0edcf0d 82%);
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
      border:0;box-shadow:inset 0 1px #ffffff16}
    .time-pill::before,.time-pill::after{content:"";position:absolute;top:9px;width:6px;height:6px;border-radius:50%;background:#092d24be;
      box-shadow:inset 0 1px 2px #0006,0 1px 0 #e9efcf30;pointer-events:none}
    .time-pill::before{left:12px}.time-pill::after{right:12px}
    .time-n{font-family:'Yeseva One',Georgia,serif;font-size:39px;line-height:1;color:#ffe0a3;letter-spacing:-.03em;margin-top:4px}
    .time-label{margin-top:6px;font-size:9.5px;font-weight:600;line-height:1.1;color:#f1e2c5;letter-spacing:-.018em;white-space:nowrap}
    @media(max-width:330px){.advent-entry{height:114px;padding:16px}.entry-layout{grid-template-columns:minmax(0,1fr) 82px;column-gap:9px}.card-title{font-size:23px}.time-pill{width:82px;height:82px}.time-n{font-size:36px}.time-label{font-size:9px}}
    /* Navigation is a full-screen route, never a bottom sheet. */
    .calendar-route{position:fixed;inset:0;z-index:40;width:100%;max-width:360px;margin:0 auto;display:flex;flex-direction:column;
      color:#fbf5e8;background:#08251d;transform:translateX(105%);visibility:hidden;
      transition:transform .34s cubic-bezier(.2,.78,.2,1),visibility .34s;
      box-shadow:0 0 65px #061c16a6;}
    .calendar-route.open{transform:translateX(0);visibility:visible}
    .route-content{flex:1;min-height:0;position:relative;background:#08241d}
    .route-content iframe{display:block;border:0;width:100%;height:100%;background:#08241d}
    .route-load{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:13px;color:#e6f0df;font-size:13px;pointer-events:none;background:#08241d}
    .route-load img{width:105px;height:105px;object-fit:contain}
    .route-load a{pointer-events:auto;color:#f9d897}
    .route-load.hidden{display:none}
    .note{max-width:360px;margin:0 auto;padding:12px 20px 20px;font-size:12px;line-height:1.5;color:#718173;text-align:center}
    @media(min-width:600px){body{background:#eef2ed}.screen{margin:24px auto;border-radius:24px;box-shadow:0 25px 90px #06261934}.calendar-route{box-shadow:0 0 90px #061c1685}}
    @media(prefers-reduced-motion:reduce){.flake,.glass-star{animation:none}.flake{opacity:.35}.advent-entry,.calendar-route{transition:none}}
  
.screen{min-height:220px;overflow:hidden;padding:26px 0 42px}
.insert{margin:0 6.667%;position:relative}
.note{padding:0 24px 20px}
</style>
</head>
<body>
<main class="screen" id="homeScreen" aria-label="Утверждённая входная карточка Адвента">
<div class="insert">
<button class="advent-entry" type="button" id="openAdvent" aria-label="Открой свой декабрь. До Нового года осталось 40 дней.">
      <span class="entry-fir" aria-hidden="true"></span>
       <span class="texture" aria-hidden="true"></span>
      <span class="glow" aria-hidden="true"></span>
      <span class="glass-star" aria-hidden="true">✦</span>
      <span class="flake f1" aria-hidden="true"></span><span class="flake f2" aria-hidden="true"></span><span class="flake f3" aria-hidden="true"></span>
       <span class="flake f4" aria-hidden="true"></span><span class="flake f5" aria-hidden="true"></span><span class="flake f6" aria-hidden="true"></span><span class="flake f7" aria-hidden="true"></span><span class="flake f8" aria-hidden="true"></span>
      <span class="entry-layout">
        <span class="copy"><span class="card-title">Открой свой<br>декабрь</span></span>
        <span class="time-pill" aria-hidden="true"><span class="time-n" id="countDays">40</span><span class="time-label" id="countLabel">дней до 2027</span></span>
      </span>
    </button>
</div>
</main>
<div class="note">Публичный изолированный UI-прототип карточки v9. Скриншот внутреннего приложения сюда не включён. При нажатии открывается действующий календарь.</div>
<section class="calendar-route" id="calendarRoute" aria-hidden="true" aria-label="Страница Адвент-календаря">

      document.getElementById('countDays').textContent=days||'✦';
      document.getElementById('countLabel').textContent=days?dayWord(days)+' до 2027':'С Новым годом!';
      entry.setAttribute('aria-label','Открой свой декабрь. '+(days?'До Нового года '+days+' '+dayWord(days):'С Новым годом!')+'. Открыть календарь');
      let lastFocus=null, loaded=false;
      function show(push=true){
        lastFocus=document.activeElement;
        route.classList.add('open'); route.setAttribute('aria-hidden','false');
        home.inert=true; document.body.style.overflow='hidden';
        if(push && location.hash!=='#advent')history.pushState({page:'advent'},'','#advent');
        if(!loaded){
          const previewDay=at.getFullYear()===2026&&at.getMonth()===11&&[1,15,31].includes(at.getDate())?'?preview='+at.getDate():'';
          // Refresh only the embedded calendar, preserving the approved v9 entry card.
          // A distinct URL each time avoids old HTML from mobile/browser/iframe caches.
          frame.src='https://hoseantonio85-art.github.io/advent-calendar/'+(previewDay?previewDay+'&':'?')+'fresh='+Date.now();
          loaded=true;
        }
        route.setAttribute('tabindex','-1');route.focus();
      }
      function hide(){
        route.classList.remove('open');route.setAttribute('aria-hidden','true');
        home.inert=false;document.body.style.overflow='';
        if(lastFocus instanceof HTMLElement)lastFocus.focus();
      }
      function goBack(){
        if(location.hash==='#advent')history.back();else hide();
      }
      entry.addEventListener('click',()=>show(true));
      window.addEventListener('message',event=>{if(event.source===frame.contentWindow && event.data?.type==='advent:exit')goBack();});
      frame.addEventListener('load',()=>loading.classList.add('hidden'));
      window.addEventListener('popstate',()=>location.hash==='#advent'?show(false):hide());
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&route.classList.contains('open'))goBack();});
      if(location.hash==='#advent')show(false);
    })();
  
</script>
</body>
</html>
