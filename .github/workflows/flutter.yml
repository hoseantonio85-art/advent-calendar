name: Flutter foundation
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-content.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - run: flutter analyze
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - run: flutter test --dart-define=ADVENT_VISUALS=true test/visual_test.dart
        working-directory: flutter
      - run: flutter pub get
        working-directory: flutter/example
      - run: flutter analyze
        working-directory: flutter/example
      - run: flutter create --platforms=web --project-name advent_demo .
        working-directory: flutter/example
      - run: flutter build web
        working-directory: flutter/example
