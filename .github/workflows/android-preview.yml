name: Publish Android preview

on:
  workflow_run:
    workflows: [Flutter foundation]
    types: [completed]
    branches: [feature/issue-2-native-calendar]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Flutter foundation run to publish
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: android-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'hoseantonio85-art/advent-calendar' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select a verified build from our own feature branch
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const id = Number(context.payload.workflow_run?.id || context.payload.inputs?.source_run_id);
            if (!Number.isSafeInteger(id) || id <= 0) throw Error('Invalid source run');
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: id});
            if (run.workflow_id !== 427003215 || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.event !== 'pull_request' || run.head_repository?.full_name !== 'hoseantonio85-art/advent-calendar' ||
                run.head_branch !== 'feature/issue-2-native-calendar' || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              throw Error('Only successful, trusted Flutter PR builds may be published');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...repo, run_id: id});
            if (!['verify','android-motion','android-release'].every(name => jobs.jobs.some(j => j.name === name && j.conclusion === 'success'))) {
              throw Error('Verification, Android motion and release audit must pass');
            }
            let current = {};
            try {
              const {data: file} = await github.rest.repos.getContent({...repo, path: 'docs/android-preview.json', ref: 'main'});
              current = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            } catch (error) { if (error.status !== 404) throw error; }
            const old = current.runNumber > run.run_number ||
              (current.runNumber === run.run_number && current.attempt >= run.run_attempt);
            core.setOutput('skip', String(old));
            core.setOutput('run_id', String(id));
            core.setOutput('sha', run.head_sha);
            core.setOutput('number', String(run.run_number));
            core.setOutput('attempt', String(run.run_attempt));
            core.info(old ? 'This build is already published or superseded' : `Publishing verified run ${id}`);

      - name: Download the existing tested APK without rebuilding it
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: advent-demo-debug-apk
          path: android-apk
          repository: hoseantonio85-art/advent-calendar
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: steps.source.outputs.skip != 'true'
        with:
          name: advent-demo-release-arm64
          path: android-release
          repository: hoseantonio85-art/advent-calendar
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.skip != 'true'
        with:
          name: advent-demo-profile-arm64
          path: android-profile
          repository: hoseantonio85-art/advent-calendar
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.skip != 'true'
        with:
          name: advent-apk-size-report
          path: android-size
          repository: hoseantonio85-art/advent-calendar
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.source.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 0
          path: merge-audit-source
      - name: Probe full Git merges without moving any branch
        if: steps.source.outputs.skip != 'true'
        run: |
          repo=merge-audit-source
          report=android-size/pr-merge-audit.txt
          git -C "$repo" fetch --no-tags origin main feature/issue-3-advent-foundation feature/issue-2-native-calendar
          git -C "$repo" --version > "$report"
          for ref in main feature/issue-3-advent-foundation feature/issue-2-native-calendar; do
            printf '%s ' "$ref" >> "$report"
            git -C "$repo" rev-parse "origin/$ref" >> "$report"
          done
          probe() {
            printf '\nPAIR: %s + %s\n' "$1" "$2" >> "$report"
            set +e
            git -C "$repo" merge-tree --write-tree --messages "$1" "$2" >> "$report" 2>&1
            merge_status=$?
            set -e
            printf 'merge-tree exit: %s (0 clean, 1 conflicts, other indeterminate)\n' "$merge_status" >> "$report"
          }
          probe origin/main origin/feature/issue-3-advent-foundation
          probe origin/main origin/feature/issue-2-native-calendar
          cat "$report"
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.skip != 'true'
        with:
          name: advent-pr-merge-audit
          path: android-size/pr-merge-audit.txt
      - name: Publish a public APK and update the repository home page
        if: steps.source.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_NUMBER: ${{ steps.source.outputs.number }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        with:
          script: |
            // Inserted into the trusted default-branch publication workflow.
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const runId = Number(process.env.SOURCE_RUN), sha = process.env.SOURCE_SHA;
            const runNumber = Number(process.env.SOURCE_NUMBER), attempt = Number(process.env.SOURCE_ATTEMPT);
            const base = 'https://github.com/hoseantonio85-art/advent-calendar';
            const files = [
              ['release', 'android-release/advent-calendar-test-release-arm64.apk', 'advent-calendar-test-release-arm64.apk', 'application/vnd.android.package-archive'],
              ['debug', 'android-apk/app-debug.apk', 'advent-calendar-preview.apk', 'application/vnd.android.package-archive'],
              ['profile', 'android-profile/advent-calendar-profile-arm64.apk', 'advent-calendar-profile-arm64.apk', 'application/vnd.android.package-archive'],
              ['report', 'android-size/apk-size-report.json', 'apk-size-report.json', 'application/json'],
              ['reportMd', 'android-size/apk-size-report.md', 'apk-size-report.md', 'text/markdown'],
              ['mergeAudit', 'android-size/pr-merge-audit.txt', 'pr-merge-audit.txt', 'text/plain'],
            ].map(([kind,path,name,type]) => {
              const data=fs.readFileSync(path);
              if (name.endsWith('.apk') && (data.length < 1000000 || data[0] !== 0x50 || data[1] !== 0x4b)) throw Error('Invalid APK: '+name);
              return {kind,name,type,data,bytes:data.length,checksum:crypto.createHash('sha256').update(data).digest('hex')};
            });
            const sizes=JSON.parse(files.find(f=>f.kind==='report').data.toString('utf8'));
            const primary=files.find(f=>f.kind==='release'), tag=`android-preview-${runId}`;
            const date=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',dateStyle:'long',timeStyle:'short'}).format(new Date());
            const body=`Тестовые сборки автономного demo, не production и не магазинный выпуск.\n\n`+
              `Основная: **advent-calendar-test-release-arm64.apk**, release/AOT, только ARM64. Подпись тестовая Android Debug, приложение com.example.advent_demo.\n\n`+
              `Debug — универсальный диагностический APK; Profile ARM64 — только для замеров. Release/Profile собраны в одном job с одной тестовой подписью.\n\n`+
              `Код [${sha.slice(0,7)}](${base}/commit/${sha}); [полный CI](${base}/actions/runs/${runId}), включая native Android и аудит APK.\n\n`+
              files.map(f=>`${f.name}: ${f.bytes} bytes; SHA-256 \`${f.checksum}\``).join('\n\n')+
              `\n\nСравнение ABI/режимов и состав приложения: apk-size-report.md / .json. Графика не пересжималась.\n\n`+
              `Отладочная подпись CI может отличаться от ранее установленного demo. Удаление приложения стирает его локальный прогресс.\n\n${date} (Москва).`;
            let release;
            try { ({data:release}=await github.rest.repos.getReleaseByTag({...repo,tag}));
              ({data:release}=await github.rest.repos.updateRelease({...repo,release_id:release.id,body,draft:false,prerelease:true}));
            } catch(error) { if(error.status!==404)throw error;
              ({data:release}=await github.rest.repos.createRelease({...repo,tag_name:tag,target_commitish:sha,
                name:`Android test release ARM64 · ${sha.slice(0,7)} · #${runNumber}`,body,draft:false,prerelease:true,make_latest:'false'}));
            }
            const {data:assets}=await github.rest.repos.listReleaseAssets({...repo,release_id:release.id});
            for(const file of files){
              let asset=assets.find(a=>a.name===file.name&&a.digest===`sha256:${file.checksum}`);
              if(!asset){for(const a of assets.filter(a=>a.name===file.name))await github.rest.repos.deleteReleaseAsset({...repo,asset_id:a.id});
                ({data:asset}=await github.rest.repos.uploadReleaseAsset({...repo,release_id:release.id,name:file.name,
                  headers:{'content-type':file.type,'content-length':file.bytes},data:file.data}));}
              file.url=asset.browser_download_url;
            }
            const url=kind=>files.find(f=>f.kind===kind).url;
            const metadata={sourceSha:sha,sourceRun:runId,runNumber,attempt,checksum:primary.checksum,
              apk:url('release'),debugApk:url('debug'),profileApk:url('profile'),sizeReport:url('reportMd'),mergeAudit:url('mergeAudit'),
              buildMode:'test-release',abi:'arm64-v8a',signing:'Android Debug (test only)',
              bytes:primary.bytes,sizes:Object.fromEntries(Object.entries(sizes.apks).map(([k,v])=>[k,v.bytes])),
              release:release.html_url,publishedAt:new Date().toISOString(),publicationRun:context.runId};
            const start='<!-- android-preview:start -->',end='<!-- android-preview:end -->';
            const badge='https://img.shields.io/badge/Android-'+encodeURIComponent('Тестовый release ARM64')+'-2E7D32?logo=android&logoColor=white';
            const block=`${start}\n## 📱 Android · тестовая release-сборка ARM64\n\n`+
              `[![Скачать APK](${badge})](${metadata.apk})\n\n`+
              `**[Скачать тестовый release APK · ARM64](${metadata.apk})** · [Release](${metadata.release})\n\n`+
              `[Debug · универсальный](${metadata.debugApk}) · [Profile · ARM64, для замеров](${metadata.profileApk}) · [Размер и состав APK](${metadata.sizeReport})\n\n`+
              `Проверенный код PR #6: \`${sha.slice(0,7)}\`, ${date} (Москва). Release: ${(primary.bytes/1048576).toFixed(2)} MiB. `+
              `Тестовая подпись Android Debug, автономное demo; **не production-релиз**. Нативная графика сохранена.\n\n`+
              `Ссылки обновляются после всех проверок. При конфликте тестовой подписи переустановка demo удалит его локальный прогресс.\n${end}`;
            function insert(text){const a=text.indexOf(start),b=text.indexOf(end);
              if((a<0)!==(b<0)||(a>=0&&b<a))throw Error('Malformed download section');
              return a>=0?text.slice(0,a)+block+text.slice(b+end.length):block+'\n\n'+text;
            }
            async function update(branch,withMetadata){
              for(let retry=0;retry<3;retry++){
                const {data:ref}=await github.rest.git.getRef({...repo,ref:`heads/${branch}`}),head=ref.object.sha;
                const {data:commit}=await github.rest.git.getCommit({...repo,commit_sha:head});
                const {data:readme}=await github.rest.repos.getContent({...repo,path:'README.md',ref:head});
                if(withMetadata){try{const {data:f}=await github.rest.repos.getContent({...repo,path:'docs/android-preview.json',ref:head});
                  const old=JSON.parse(Buffer.from(f.content,'base64').toString('utf8'));
                  if(old.runNumber>runNumber||(old.runNumber===runNumber&&old.attempt>attempt))return;
                }catch(error){if(error.status!==404)throw error;}}
                const tree=[{path:'README.md',mode:'100644',type:'blob',content:insert(Buffer.from(readme.content,'base64').toString('utf8'))}];
                if(withMetadata)tree.push({path:'docs/android-preview.json',mode:'100644',type:'blob',content:JSON.stringify(metadata,null,2)+'\n'});
                const {data:built}=await github.rest.git.createTree({...repo,base_tree:commit.tree.sha,tree});
                const {data:next}=await github.rest.git.createCommit({...repo,message:`docs: publish Android test release #${runNumber} [skip ci]`,tree:built.sha,parents:[head]});
                try{await github.rest.git.updateRef({...repo,ref:`heads/${branch}`,sha:next.sha,force:false});return;}
                catch(error){if(![409,422].includes(error.status)||retry===2)throw error;}
              }
            }
            await update('main',true);await update('feature/issue-2-native-calendar',false);
            await core.summary.addHeading('Android test release ARM64').addLink('Release APK',metadata.apk)
              .addLink('Size report',metadata.sizeReport).write();
