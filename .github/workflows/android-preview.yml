name: Publish Android preview

on:
  workflow_run:
    workflows: [Flutter foundation]
    types: [completed]
    branches: [feature/issue-2-native-calendar]
  push:
    branches: [main]
    paths: [.github/workflows/android-preview.yml]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Flutter foundation run to publish
        required: true
        default: '45211174588'

permissions:
  actions: read
  contents: write

concurrency:
  group: android-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'hoseantonio85-art/advent-calendar' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select a verified build from our own feature branch
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const id = Number(context.payload.workflow_run?.id || context.payload.inputs?.source_run_id || '45211174588');
            if (!Number.isSafeInteger(id) || id <= 0) throw Error('Invalid source run');
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: id});
            if (run.workflow_id !== 427003215 || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.event !== 'pull_request' || run.head_repository?.full_name !== 'hoseantonio85-art/advent-calendar' ||
                run.head_branch !== 'feature/issue-2-native-calendar' || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              throw Error('Only successful, trusted Flutter PR builds may be published');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...repo, run_id: id});
            if (!['verify','android-motion'].every(name => jobs.jobs.some(j => j.name === name && j.conclusion === 'success'))) {
              throw Error('Both verification and Android motion must pass');
            }
            let current = {};
            try {
              const {data: file} = await github.rest.repos.getContent({...repo, path: 'docs/android-preview.json', ref: 'main'});
              current = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            } catch (error) { if (error.status !== 404) throw error; }
            const old = current.runNumber > run.run_number ||
              (current.runNumber === run.run_number && current.attempt >= run.run_attempt);
            core.setOutput('skip', String(old));
            core.setOutput('run_id', String(id));
            core.setOutput('sha', run.head_sha);
            core.setOutput('number', String(run.run_number));
            core.setOutput('attempt', String(run.run_attempt));
            core.info(old ? 'This build is already published or superseded' : `Publishing verified run ${id}`);

      - name: Download the existing tested APK without rebuilding it
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: advent-demo-debug-apk
          path: android-apk
          repository: hoseantonio85-art/advent-calendar
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish a public APK and update the repository home page
        if: steps.source.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_NUMBER: ${{ steps.source.outputs.number }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const runId = Number(process.env.SOURCE_RUN), sha = process.env.SOURCE_SHA;
            const runNumber = Number(process.env.SOURCE_NUMBER), attempt = Number(process.env.SOURCE_ATTEMPT);
            const base = 'https://github.com/hoseantonio85-art/advent-calendar';
            const apk = fs.readFileSync('android-apk/app-debug.apk');
            if (apk.length < 1000000 || apk[0] !== 0x50 || apk[1] !== 0x4b) throw Error('Missing or invalid APK archive');
            const checksum = crypto.createHash('sha256').update(apk).digest('hex');
            const tag = `android-preview-${runId}`;
            const name = 'advent-calendar-preview.apk';
            const date = new Intl.DateTimeFormat('ru-RU', {timeZone: 'Europe/Moscow', dateStyle: 'long', timeStyle: 'short'}).format(new Date());
            const body = `Тестовая Android-сборка независимого Flutter-календаря для приёмки.\n\n` +
              `Исходники: [${sha.slice(0,7)}](${base}/commit/${sha}). [Успешные проверки](${base}/actions/runs/${runId}): ` +
              `анализ, unit/widget, визуальная сверка и Android-сценарий.\n\n` +
              `Скачайте **${name}** из Assets — это обычный APK, распаковка ZIP не нужна. ` +
              `Это demo, не production-релиз.\n\n` +
              `Отладочная подпись CI может отличаться от старого demo. Если требуется удаление прежнего приложения, его локальный прогресс стирается.\n\n` +
              `SHA-256: \`${checksum}\`\n\nОпубликовано ${date} (Москва).`;
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({...repo, tag}));
              ({data: release} = await github.rest.repos.updateRelease({...repo, release_id: release.id, body, draft: false, prerelease: true}));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({data: release} = await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: sha,
                name: `Android demo · ${sha.slice(0,7)} · проверка #${runNumber}`, body, draft: false, prerelease: true, make_latest: 'false'}));
            }
            const {data: assets} = await github.rest.repos.listReleaseAssets({...repo, release_id: release.id});
            let asset = assets.find(a => a.name === name && a.digest === `sha256:${checksum}`);
            if (!asset) {
              for (const a of assets.filter(a => a.name === name)) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: a.id});
              ({data: asset} = await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name,
                headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': apk.length}, data: apk}));
            }
            const metadata = {sourceSha: sha, sourceRun: runId, runNumber, attempt, checksum,
              apk: asset.browser_download_url, release: release.html_url, publishedAt: new Date().toISOString(),
              publicationRun: context.runId};
            const start = '<!-- android-preview:start -->', end = '<!-- android-preview:end -->';
            const badge = 'https://img.shields.io/badge/Android-' + encodeURIComponent('Скачать APK') + '-2E7D32?logo=android&logoColor=white';
            const block = `${start}\n## 📱 Android · сборка для проверки\n\n` +
              `[![Скачать APK](${badge})](${metadata.apk})\n\n` +
              `**[Скачать APK напрямую](${metadata.apk})** · [Страница сборки](${metadata.release})\n\n` +
              `Проверенная Flutter-сборка из PR #6: \`${sha.slice(0,7)}\`, ${date} (Москва). ` +
              `Обычный APK, без ZIP и входа в Actions. Это demo для приёмки.\n\n` +
              `Ссылка обновляется после успешных проверок новой сборки. ` +
              `При конфликте отладочной подписи потребуется переустановка demo с удалением локального прогресса.\n${end}`;
            function insert(text) {
              const a = text.indexOf(start), b = text.indexOf(end);
              if ((a < 0) !== (b < 0) || (a >= 0 && b < a)) throw Error('Malformed download section; refusing to overwrite README');
              if (a >= 0) return text.slice(0,a) + block + text.slice(b + end.length);
              if (text.startsWith('# ')) {
                const line = text.indexOf('\n');
                return text.slice(0,line+1) + '\n' + block + '\n\n' + text.slice(line+1).trimStart();
              }
              return block + '\n\n' + text;
            }
            async function update(branch, withMetadata) {
              for (let retry = 0; retry < 3; retry++) {
                const {data: ref} = await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
                const head = ref.object.sha;
                const {data: commit} = await github.rest.git.getCommit({...repo, commit_sha: head});
                const {data: readme} = await github.rest.repos.getContent({...repo, path: 'README.md', ref: head});
                if (withMetadata) {
                  try {
                    const {data: file} = await github.rest.repos.getContent({...repo, path: 'docs/android-preview.json', ref: head});
                    const old = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
                    if (old.runNumber > runNumber || (old.runNumber === runNumber && old.attempt > attempt)) return;
                  } catch (error) { if (error.status !== 404) throw error; }
                }
                const text = Buffer.from(readme.content, 'base64').toString('utf8');
                const tree = [{path: 'README.md', mode: '100644', type: 'blob', content: insert(text)}];
                if (withMetadata) tree.push({path: 'docs/android-preview.json', mode: '100644', type: 'blob', content: JSON.stringify(metadata,null,2)+'\n'});
                const {data: built} = await github.rest.git.createTree({...repo, base_tree: commit.tree.sha, tree});
                const {data: next} = await github.rest.git.createCommit({...repo, message: `docs: publish Android preview #${runNumber} [skip ci]`, tree: built.sha, parents: [head]});
                try {
                  await github.rest.git.updateRef({...repo, ref: `heads/${branch}`, sha: next.sha, force: false});
                  return;
                } catch (error) { if (![409,422].includes(error.status) || retry === 2) throw error; }
              }
            }
            await update('main', true);
            try { await update('feature/issue-2-native-calendar', false); }
            catch (error) { if (error.status !== 404) throw error; }
            await core.summary.addHeading('Android preview published').addLink('Download APK', metadata.apk)
              .addRaw(`\n\nSource: ${sha}\n\nSHA-256: ${checksum}\n`).write();
            core.info(`Published ${metadata.apk}`);
